services:
  chirpstack:
    image: nondetalle/chirpstack:4.14.0.cs.3
    command: -c /etc/chirpstack
    restart: unless-stopped
    volumes:
      - ./configuration/chirpstack:/etc/chirpstack
    depends_on:
      - postgres
      - mosquitto
      - redis
    environment:
      - MQTT_BROKER_HOST=mosquitto
      - REDIS_HOST=redis
      - POSTGRESQL_HOST=postgres
    ports:
      - "8080:8080"

  chirpstack-gateway-bridge:
    image: chirpstack/chirpstack-gateway-bridge:4
    restart: unless-stopped
    ports:
      - "1700:1700/udp"
    volumes:
      - ./configuration/chirpstack-gateway-bridge:/etc/chirpstack-gateway-bridge
    environment:
      - INTEGRATION__MQTT__EVENT_TOPIC_TEMPLATE=eu868/gateway/{{ .GatewayID }}/event/{{ .EventType }}
      - INTEGRATION__MQTT__STATE_TOPIC_TEMPLATE=eu868/gateway/{{ .GatewayID }}/state/{{ .StateType }}
      - INTEGRATION__MQTT__COMMAND_TOPIC_TEMPLATE=eu868/gateway/{{ .GatewayID }}/command/#
    depends_on:
      - mosquitto

  chirpstack-rest-api:
    image: nondetalle/chirpstack-rest-api:4.14.0.cs.3
    restart: unless-stopped
    command: --server chirpstack:8080 --bind 0.0.0.0:8090 --insecure
    ports:
      - "8090:8090"
    depends_on:
      - chirpstack

  postgres:
    image: postgres:14-alpine
    restart: unless-stopped
    volumes:
      - ./configuration/postgresql/initdb:/docker-entrypoint-initdb.d
      - postgresqldata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=chirpstack
      - POSTGRES_PASSWORD=chirpstack
      - POSTGRES_DB=chirpstack

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 300 1 --save 60 100 --appendonly no
    volumes:
      - type: tmpfs
        target: /data

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes: 
      - ./configuration/mosquitto/config/:/mosquitto/config/

  telemetry-ingester:
    build:
      context: ./telemetry-ingester
      args: 
        API_VERSION: v4.14.0+cs.3
    command: -c /etc/telemetry-ingester
    restart: unless-stopped
    volumes:
      - ./configuration/telemetry-ingester:/etc/telemetry-ingester
    depends_on:
      - chirpstack
      - influxdb

  influxdb:
    image: influxdb:2.7
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: password
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: token
      DOCKER_INFLUXDB_INIT_ORG: cnam
      DOCKER_INFLUXDB_INIT_BUCKET: chirpstack
      INFLUXD_SESSION_RENEW_DISABLED: true
      INFLUXD_SESSION_LENGTH: 1440

  config-server:
    build: 
      context: ./config-server
      args: 
        API_VERSION: v4.14.0+cs.3
    command: -c /etc/config-server
    restart: unless-stopped
    secrets: [chirpstack-api-token]
    environment: 
      CHIRPSTACK_API_TOKEN_FILE: /run/secrets/chirpstack-api-token
    volumes:
      - ./configuration/config-server:/etc/config-server
      - ./config-server/src:/usr/src/app
    depends_on:
      - chirpstack
      - influxdb
    profiles: ["all"]

  elora:
    image: nondetalle/elora:latest
    cap_add: [NET_ADMIN]
    secrets: [chirpstack-api-token]
    environment: 
      CHIRPSTACK_API_TOKEN_FILE: /run/secrets/chirpstack-api-token
    volumes:
      - ./configuration/elora/elora.toml:/home/elora/configuration.toml
      - ./configuration/elora/example:/home/elora/ns-3-dev/scratch/elora-example
      - ./data:/home/elora/data
    depends_on:
      - chirpstack-rest-api
      - chirpstack-gateway-bridge
    profiles: ["all"]

secrets:
  chirpstack-api-token:
    file: .env.chirpstack-api-token

volumes:
  postgresqldata:
